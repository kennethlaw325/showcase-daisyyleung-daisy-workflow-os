<!doctype html>
<html lang="zh-HK">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="示範用戶的中英雙語工作流程、automation 與底層技能地圖。">
    <title>Demo Workflow OS</title>
    <style>:root {
  --background: #f2f7fd;
  --surface: #f9fbff;
  --surface-strong: #ffffff;
  --ink: #172033;
  --muted: #5f6b7d;
  --faint: #7d8aa0;
  --border: #c8d5e8;
  --border-strong: #253552;
  --violet: #2563eb;
  --violet-soft: #dbeafe;
  --violet-pale: #eff6ff;
  --green: #14745c;
  --green-soft: #d9f1e9;
  --amber: #9b650f;
  --amber-soft: #fff0ca;
  --blue: #334eac;
  --blue-soft: #e0e7ff;
  --rose: #a13d62;
  --rose-soft: #f9e1ea;
  --orange: #a44b18;
  --orange-soft: #fce5d5;
  --slate-soft: #e8eef6;
  --shadow: 12px 12px 0 #d9e7fb;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background:
    linear-gradient(rgba(37, 99, 235, 0.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(37, 99, 235, 0.055) 1px, transparent 1px),
    var(--background);
  background-size: 40px 40px;
  color: var(--ink);
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 16px;
  line-height: 1.55;
}

button,
input {
  font: inherit;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

button {
  color: inherit;
}

a {
  color: inherit;
}

.skip-link {
  position: fixed;
  left: 16px;
  top: 12px;
  z-index: 100;
  padding: 10px 14px;
  background: var(--ink);
  color: white;
  transform: translateY(-160%);
  transition: transform 160ms ease;
}

.skip-link:focus {
  transform: translateY(0);
}

.site-shell {
  width: min(1544px, calc(100% - 56px));
  margin: 28px auto;
  overflow: clip;
  border: 1px solid var(--border-strong);
  background: rgba(249, 251, 255, 0.96);
  box-shadow: var(--shadow);
}

.topbar {
  min-height: 142px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 32px;
  padding: 30px 42px 28px;
  border-bottom: 1px solid var(--border-strong);
}

.topbar-actions {
  display: grid;
  justify-items: end;
  gap: 16px;
}

.language-panel {
  display: inline-flex;
  border: 1px solid var(--border-strong);
  background: white;
}

.language-panel button {
  min-width: 92px;
  min-height: 44px;
  padding: 0 14px;
  border: 0;
  border-right: 1px solid var(--border);
  background: transparent;
  cursor: pointer;
  font-size: 0.82rem;
  font-weight: 800;
  transition: background 160ms ease, color 160ms ease;
}

.language-panel button:last-child {
  border-right: 0;
}

.language-panel button:hover,
.language-panel button.language-active {
  background: var(--violet);
  color: white;
}

.eyebrow,
.section-index,
.panel-heading,
.inspector-label {
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-size: 0.75rem;
  font-weight: 800;
}

.eyebrow {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0 0 8px;
  color: var(--violet);
}

.eyebrow-line {
  width: 44px;
  height: 5px;
  background: var(--violet);
}

h1,
h2,
h3,
p {
  margin-top: 0;
}

h1 {
  margin-bottom: 0;
  font-size: clamp(2.4rem, 5vw, 4.6rem);
  line-height: 0.94;
  letter-spacing: -0.065em;
}

.registry-state {
  min-width: 250px;
  display: grid;
  justify-items: end;
  gap: 4px;
  text-align: right;
}

.health-line {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  color: var(--green);
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.health-dot {
  width: 10px;
  height: 10px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 5px var(--green-soft);
}

.snapshot-date {
  color: var(--muted);
  font-size: 0.85rem;
  font-weight: 650;
}

.section-nav {
  min-height: 56px;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 34px;
  border-bottom: 1px solid var(--border);
}

.section-nav a {
  min-height: 44px;
  display: inline-flex;
  align-items: center;
  padding: 0 14px;
  border-bottom: 3px solid transparent;
  color: var(--muted);
  font-size: 0.88rem;
  font-weight: 750;
  text-decoration: none;
  transition: color 160ms ease, border-color 160ms ease;
}

.section-nav a:hover,
.section-nav a:focus-visible {
  border-color: var(--violet);
  color: var(--ink);
}

.metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-bottom: 1px solid var(--border-strong);
}

.metric {
  position: relative;
  min-height: 148px;
  display: grid;
  grid-template-columns: auto 1fr;
  align-content: center;
  align-items: center;
  column-gap: 16px;
  padding: 22px 32px;
  border-right: 1px solid var(--border);
}

.metric:last-child {
  border-right: 0;
}

.metric::before {
  position: absolute;
  inset: 0 auto 0 0;
  width: 5px;
  background: var(--green);
  content: "";
}

.metric-paused::before {
  background: #84808b;
}

.metric-global::before {
  background: var(--violet);
}

.metric-project::before {
  background: var(--amber);
}

.metric-value {
  grid-row: 1 / span 2;
  font-size: clamp(2.8rem, 5vw, 4.6rem);
  font-weight: 800;
  letter-spacing: -0.07em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.metric-label {
  max-width: 130px;
  font-weight: 800;
  line-height: 1.12;
  text-transform: uppercase;
}

.metric-label-wide {
  max-width: none;
  white-space: nowrap;
}

.metric-code {
  color: var(--faint);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.75rem;
  font-weight: 700;
}

.company-section,
.dashboard-links-section,
.workflow-section,
.skills-section,
.system-section {
  padding: 42px;
  border-bottom: 1px solid var(--border-strong);
  scroll-margin-top: 16px;
}

.dashboard-links-section {
  background: var(--violet-pale);
}

.dashboard-links-intro {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(260px, 420px);
  gap: 32px;
  align-items: end;
  margin-bottom: 24px;
}

.dashboard-links-intro h2 {
  max-width: 760px;
  margin-bottom: 0;
  font-size: clamp(1.75rem, 3vw, 2.8rem);
  line-height: 1.02;
  letter-spacing: -0.045em;
}

.dashboard-links-intro > p {
  margin-bottom: 0;
  color: var(--muted);
}

.dashboard-link-grid {
  max-width: 1120px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.dashboard-link-jobs {
  --dashboard-accent: var(--orange);
}

.dashboard-link-card {
  --dashboard-accent: var(--violet);
  min-height: 210px;
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  gap: 10px;
  padding: 24px;
  border: 1px solid var(--border-strong);
  border-top: 6px solid var(--dashboard-accent);
  background: white;
  text-decoration: none;
  transition: box-shadow 180ms ease, transform 180ms ease;
}

.dashboard-link-card:hover {
  box-shadow: 7px 7px 0 color-mix(in srgb, var(--dashboard-accent) 20%, white);
  transform: translateY(-2px);
}

.dashboard-link-card:active {
  transform: translateY(0);
}

.dashboard-link-code {
  color: var(--dashboard-accent);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.72rem;
  font-weight: 850;
  letter-spacing: 0.08em;
}

.dashboard-link-card > strong {
  font-size: clamp(1.15rem, 2vw, 1.55rem);
  line-height: 1.15;
}

.dashboard-link-card > span:not(.dashboard-link-code, .dashboard-link-action) {
  max-width: 56ch;
  color: var(--muted);
  font-size: 0.9rem;
}

.dashboard-link-action {
  width: max-content;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--dashboard-accent);
  font-size: 0.8rem;
  font-weight: 850;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

/* Demo dashboard panel — in-page stand-in for the private dashboards. */
.dashboard-link-card {
  width: 100%;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.dashboard-demo-panel {
  max-width: 1120px;
  margin-top: 14px;
  padding: 20px 24px 24px;
  border: 1px solid var(--border-strong);
  border-top: 6px solid var(--dashboard-accent, var(--violet));
  background: var(--surface-strong);
}

.dashboard-demo-jobs {
  --dashboard-accent: var(--orange);
}

.dashboard-demo-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 10px 14px;
}

.dashboard-demo-head h3 {
  margin: 0;
  font-size: clamp(1.05rem, 1.8vw, 1.35rem);
}

.dashboard-demo-tag {
  padding: 3px 9px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  font-size: 0.72rem;
  letter-spacing: 0.04em;
}

.dashboard-demo-close {
  margin-left: auto;
  padding: 5px 14px;
  border: 1px solid var(--border-strong);
  background: white;
  color: var(--ink);
  font: inherit;
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
}

.dashboard-demo-close:hover {
  background: var(--surface);
}

.dashboard-demo-table {
  width: 100%;
  margin-top: 16px;
  border-collapse: collapse;
  font-size: 0.88rem;
}

.dashboard-demo-table th,
.dashboard-demo-table td {
  padding: 9px 12px 9px 0;
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: top;
}

.dashboard-demo-table th {
  color: var(--faint);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.dashboard-demo-notes {
  margin-top: 16px;
}

.dashboard-demo-notes > span {
  color: var(--faint);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.dashboard-demo-notes ul {
  margin: 8px 0 0;
  padding-left: 18px;
  color: var(--muted);
  font-size: 0.88rem;
  line-height: 1.7;
}

.department-all-row {
  margin-bottom: 10px;
}

.department-all,
.department-card {
  position: relative;
  border: 1px solid var(--border-strong);
  background: white;
  cursor: pointer;
  text-align: left;
  transition: background 180ms ease, box-shadow 180ms ease, transform 180ms ease;
}

.department-all:hover,
.department-card:hover,
.department-all.department-active,
.department-card.department-active {
  background: var(--violet-pale);
  box-shadow: inset 0 -5px 0 var(--department-accent, var(--violet));
}

.department-all:active,
.department-card:active {
  transform: translateY(1px);
}

.department-all {
  min-height: 68px;
  width: 100%;
  display: grid;
  grid-template-columns: 68px minmax(150px, 0.35fr) 1fr;
  gap: 16px;
  align-items: center;
  padding: 12px 18px;
}

.department-all > span,
.department-code {
  color: var(--violet);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.78rem;
  font-weight: 850;
  letter-spacing: 0.08em;
}

.department-all > strong {
  font-size: 0.95rem;
}

.department-all > small {
  color: var(--muted);
  font-size: 0.8rem;
}

.department-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 10px;
}

.department-card {
  --department-accent: var(--violet);
  min-height: 240px;
  display: grid;
  grid-template-rows: auto auto 1fr auto;
  align-content: start;
  gap: 14px;
  padding: 20px;
  border-top: 6px solid var(--department-accent);
}

.department-pr {
  --department-accent: var(--violet);
}

.department-hr {
  --department-accent: var(--green);
}

.department-it {
  --department-accent: var(--blue);
}

.department-admin {
  --department-accent: var(--amber);
}

.department-personal {
  --department-accent: var(--rose);
}

.department-copy {
  display: grid;
  gap: 2px;
}

.department-copy strong {
  font-size: 1.1rem;
  line-height: 1.15;
}

.department-copy small {
  color: var(--muted);
  font-size: 0.76rem;
  font-weight: 700;
}

.department-description {
  color: var(--muted);
  font-size: 0.875rem;
  line-height: 1.5;
}

.department-count {
  width: max-content;
  padding: 4px 8px;
  border: 1px solid var(--department-accent);
  color: var(--department-accent);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.68rem;
  font-weight: 800;
  text-transform: uppercase;
}

.section-heading {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(260px, 420px);
  gap: 32px;
  align-items: end;
  margin-bottom: 28px;
}

.section-index {
  margin-bottom: 8px;
  color: var(--violet);
}

.section-heading h2 {
  max-width: 850px;
  margin-bottom: 0;
  font-size: clamp(1.85rem, 3.3vw, 3.2rem);
  line-height: 1.02;
  letter-spacing: -0.045em;
}

.section-heading > p {
  margin-bottom: 0;
  color: var(--muted);
}

.workflow-tools {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 18px;
}

.workflow-filter-stack {
  display: grid;
  gap: 8px;
}

.current-department {
  color: var(--muted);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.filter-group {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.filter-group button {
  min-height: 44px;
  padding: 0 16px;
  border: 1px solid var(--border);
  background: var(--surface-strong);
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: 750;
  transition: border-color 160ms ease, background 160ms ease, color 160ms ease;
}

.filter-group button:hover {
  border-color: var(--violet);
}

.filter-group button.filter-active {
  border-color: var(--violet);
  background: var(--violet);
  color: white;
}

.search-field {
  width: min(100%, 320px);
  display: grid;
  gap: 5px;
  color: var(--muted);
  font-size: 0.75rem;
  font-weight: 750;
}

.search-field input {
  min-height: 46px;
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 0;
  background: white;
  padding: 0 14px;
  color: var(--ink);
}

.workflow-layout {
  display: grid;
  grid-template-columns: minmax(330px, 0.78fr) minmax(480px, 1.22fr);
  gap: 20px;
  align-items: start;
}

.workflow-list {
  overflow: hidden;
  border: 1px solid var(--border-strong);
  background: var(--surface-strong);
}

.workflow-row {
  width: 100%;
  min-height: 96px;
  display: grid;
  grid-template-columns: 58px minmax(190px, 1fr) auto;
  gap: 14px;
  align-items: center;
  padding: 16px 20px;
  border: 0;
  border-bottom: 1px solid var(--border);
  background: transparent;
  cursor: pointer;
  text-align: left;
  transition: background 160ms ease, box-shadow 160ms ease;
}

.workflow-chips {
  grid-column: 2 / -1;
}

.workflow-row:last-child {
  border-bottom: 0;
}

.workflow-row:hover,
.workflow-row.workflow-selected {
  background: var(--violet-pale);
  box-shadow: inset 5px 0 0 var(--violet);
}

.workflow-number {
  color: var(--violet);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.8rem;
  font-weight: 800;
}

.workflow-name {
  min-width: 0;
  display: grid;
  gap: 3px;
}

.workflow-name strong {
  font-size: 1rem;
  line-height: 1.25;
}

.workflow-name > span {
  color: var(--muted);
  font-size: 0.79rem;
  font-weight: 650;
}

.workflow-chips,
.inspector-skills > div {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.workflow-chips span,
.inspector-skills > div span {
  display: inline-flex;
  align-items: center;
  min-height: 30px;
  padding: 4px 9px;
  border: 1px solid #9db9e8;
  background: var(--surface-strong);
  color: #1e4d8f;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.7rem;
  font-weight: 700;
  overflow-wrap: anywhere;
}

.status-badge {
  min-width: 82px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 5px 9px;
  border: 1px solid currentColor;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
}

.status-active {
  background: var(--green-soft);
  color: var(--green);
}

.status-paused {
  background: var(--slate-soft);
  color: #56515d;
}

.status-manual {
  background: var(--violet-soft);
  color: #1d4ed8;
}

.status-planned {
  background: var(--rose-soft);
  color: #8b3153;
}

.route-inspector {
  position: sticky;
  top: 16px;
  border: 1px solid var(--border-strong);
  background: white;
  color: var(--ink);
}

.inspector-summary {
  --department-accent: var(--violet);
  padding: 24px;
  border-top: 6px solid var(--department-accent);
  background: var(--ink);
  color: white;
}

.inspector-pr .inspector-summary {
  --department-accent: var(--violet);
}

.inspector-hr .inspector-summary {
  --department-accent: var(--green);
}

.inspector-it .inspector-summary {
  --department-accent: #6f9ce0;
}

.inspector-admin .inspector-summary {
  --department-accent: #e2b451;
}

.inspector-personal .inspector-summary {
  --department-accent: #d7779b;
}

.inspector-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 28px;
  color: #cfc8dc;
}

.route-inspector h3 {
  margin-bottom: 10px;
  font-size: 1.65rem;
  line-height: 1.05;
  letter-spacing: -0.035em;
}

.inspector-summary > p {
  color: #d0cad6;
  font-size: 0.9rem;
}

.route-inspector dl {
  display: grid;
  gap: 0;
  margin: 22px 0;
  border-top: 1px solid #47424e;
}

.route-inspector dl > div {
  display: grid;
  grid-template-columns: 90px 1fr;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px solid #47424e;
}

.route-inspector dt {
  color: #aca4b4;
  font-size: 0.72rem;
  font-weight: 750;
  text-transform: uppercase;
}

.route-inspector dd {
  margin: 0;
  font-size: 0.82rem;
  font-weight: 700;
}

.inspector-skills > span {
  display: block;
  margin-bottom: 10px;
  color: var(--muted);
  font-size: 0.72rem;
  font-weight: 750;
  text-transform: uppercase;
}

.inspector-skills > div span {
  border-color: #9db9e8;
  background: var(--violet-pale);
  color: #1e4d8f;
}

.workflow-detail {
  padding: 24px;
}

.detail-heading {
  min-height: 42px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--border-strong);
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.detail-heading strong {
  color: var(--violet);
}

.step-timeline {
  margin: 0 0 26px;
  padding: 0;
  list-style: none;
}

.step-timeline li {
  position: relative;
  display: grid;
  grid-template-columns: 46px 1fr;
  gap: 14px;
  padding: 16px 0;
  border-bottom: 1px solid var(--border);
}

.step-timeline li::before {
  position: absolute;
  left: 22px;
  top: 50px;
  bottom: -17px;
  width: 1px;
  background: var(--border);
  content: "";
}

.step-timeline li:last-child::before {
  display: none;
}

.step-number {
  position: relative;
  z-index: 1;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border: 1px solid var(--violet);
  background: var(--violet-pale);
  color: var(--violet);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.72rem;
  font-weight: 850;
}

.step-recovery .step-number {
  border-color: var(--amber);
  background: var(--amber-soft);
  color: #744800;
}

.step-kicker {
  display: block;
  margin-bottom: 3px;
  color: var(--violet);
  font-size: 0.66rem;
  font-weight: 850;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.step-recovery .step-kicker {
  color: #744800;
}

.step-timeline h4 {
  margin: 0 0 4px;
  font-size: 0.95rem;
  line-height: 1.3;
}

.step-timeline p {
  margin: 0;
  color: var(--muted);
  font-size: 0.875rem;
}

.step-timeline code {
  display: block;
  width: fit-content;
  max-width: 100%;
  margin-top: 8px;
  padding: 4px 7px;
  border: 1px solid var(--border);
  background: var(--slate-soft);
  color: #504958;
  font-size: 0.68rem;
  overflow-wrap: anywhere;
  white-space: normal;
}

.route-inspector-empty {
  min-height: 280px;
  display: grid;
  place-content: center;
  gap: 6px;
  padding: 28px;
  color: var(--muted);
  text-align: center;
}

.empty-state {
  min-height: 220px;
  display: grid;
  place-content: center;
  gap: 4px;
  padding: 24px;
  color: var(--muted);
  text-align: center;
}

.empty-state strong {
  color: var(--ink);
}

.empty-state button {
  min-height: 44px;
  margin-top: 12px;
  border: 1px solid var(--violet);
  background: var(--violet);
  color: white;
  cursor: pointer;
  font-weight: 750;
}

.skills-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(300px, 0.75fr);
  gap: 20px;
}

.skill-panel {
  border: 1px solid var(--border-strong);
  background: white;
}

.panel-heading {
  min-height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border-strong);
  color: var(--muted);
}

.panel-heading strong {
  color: var(--violet);
  font-size: 1.8rem;
  letter-spacing: -0.05em;
}

.skill-cards {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.skill-card {
  min-height: 104px;
  display: grid;
  grid-template-columns: 34px 1fr;
  gap: 12px;
  align-content: start;
  padding: 18px;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}

.skill-card:nth-child(even) {
  border-right: 0;
}

.skill-mark {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border: 1px solid #9db9e8;
  background: var(--violet-pale);
  color: var(--violet);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-weight: 850;
}

.skill-card h3 {
  margin-bottom: 4px;
  font-size: 0.85rem;
  line-height: 1.25;
  overflow-wrap: anywhere;
}

.skill-card p {
  margin-bottom: 0;
  color: var(--muted);
  font-size: 0.76rem;
}

.project-cards {
  grid-template-columns: 1fr;
}

.project-cards .skill-card,
.project-cards .skill-card:nth-child(even) {
  border-right: 0;
}

.system-flow {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  margin: 0;
  padding: 0;
  border: 1px solid var(--border-strong);
  background: white;
  list-style: none;
}

.system-flow li {
  position: relative;
  min-height: 150px;
  display: grid;
  align-content: center;
  gap: 6px;
  padding: 22px;
  border-right: 1px solid var(--border);
}

.system-flow li:last-child {
  border-right: 0;
}

.system-flow li:not(:last-child)::after {
  position: absolute;
  right: -13px;
  top: calc(50% - 13px);
  z-index: 2;
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  border: 1px solid var(--border-strong);
  border-radius: 50%;
  background: var(--violet-pale);
  color: var(--violet);
  content: "→";
  font-weight: 850;
}

.system-flow li > span {
  color: var(--violet);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.76rem;
  font-weight: 800;
}

.system-flow strong {
  font-size: 1rem;
}

.system-flow small {
  color: var(--muted);
  font-size: 0.76rem;
}

.journey-section {
  --journey-progress: 0;
}

.journey-active {
  position: relative;
  height: 520svh;
  padding: 0;
  background: #081a4a;
}

.journey-sticky {
  position: sticky;
  top: 0;
  height: 100svh;
  overflow: hidden;
  background: #081a4a;
  color: white;
}

.journey-video,
.journey-shade {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

.journey-video {
  object-fit: cover;
  object-position: center;
}

.journey-shade {
  background:
    linear-gradient(180deg, rgba(6, 18, 57, 0.78) 0%, rgba(6, 18, 57, 0.08) 36%),
    linear-gradient(0deg, rgba(6, 18, 57, 0.78) 0%, transparent 44%),
    linear-gradient(90deg, rgba(6, 18, 57, 0.3), transparent 52%);
  pointer-events: none;
}

.journey-heading {
  position: absolute;
  left: clamp(28px, 4vw, 62px);
  top: clamp(28px, 6vh, 64px);
  z-index: 2;
  max-width: min(780px, 70%);
}

.journey-heading .section-index {
  margin-bottom: 10px;
  color: #ffe46b;
  text-shadow: 0 2px 12px rgba(8, 26, 74, 0.8);
}

.journey-heading h2 {
  max-width: 760px;
  margin-bottom: 0;
  color: white;
  font-size: clamp(2rem, 4.2vw, 4.5rem);
  letter-spacing: -0.055em;
  line-height: 0.98;
  text-shadow: 0 3px 18px rgba(8, 26, 74, 0.72);
}

.journey-tagline-line {
  display: block;
}

.journey-stage-card {
  position: absolute;
  left: clamp(28px, 4vw, 62px);
  bottom: clamp(46px, 7vh, 76px);
  z-index: 2;
  width: min(520px, calc(100% - 160px));
  padding: 12px 14px 13px;
  border: 1px solid #0a1e50;
  background: rgba(255, 255, 255, 0.9);
  box-shadow: 5px 5px 0 rgba(8, 26, 74, 0.64);
  color: var(--ink);
  backdrop-filter: blur(7px);
}

.journey-stage-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 5px;
  color: var(--violet);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.62rem;
  font-weight: 850;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.journey-stage-meta > span {
  display: grid;
  width: 26px;
  height: 26px;
  place-items: center;
  border: 1px solid #89a9de;
  background: var(--violet-pale);
}

.journey-stage-card h3 {
  margin-bottom: 3px;
  font-size: clamp(1rem, 1.4vw, 1.5rem);
  letter-spacing: -0.035em;
  line-height: 1.02;
}

.journey-stage-card p {
  margin-bottom: 0;
  color: var(--muted);
  font-size: clamp(0.62rem, 0.72vw, 0.66rem);
  line-height: 1.3;
}

.journey-stage-card p:lang(zh-HK) {
  font-size: clamp(0.6rem, 0.68vw, 0.64rem);
  white-space: nowrap;
}

.journey-counter {
  position: absolute;
  right: clamp(28px, 4vw, 62px);
  bottom: clamp(50px, 7vh, 80px);
  z-index: 2;
  display: flex;
  align-items: baseline;
  gap: 6px;
  color: white;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  text-shadow: 0 2px 12px rgba(8, 26, 74, 0.9);
}

.journey-counter span {
  font-size: clamp(2.8rem, 6vw, 6.4rem);
  font-weight: 850;
  letter-spacing: -0.08em;
  line-height: 0.8;
}

.journey-counter small {
  color: #ffe46b;
  font-size: 0.84rem;
  font-weight: 850;
}

.journey-progress {
  position: absolute;
  inset: auto 0 0;
  z-index: 3;
  height: 8px;
  background: rgba(255, 255, 255, 0.28);
}

.journey-progress span {
  width: 100%;
  height: 100%;
  display: block;
  background: #ffe46b;
  transform: scaleX(var(--journey-progress));
  transform-origin: left center;
}

.journey-static {
  background: var(--surface);
}

.journey-static-flow small {
  line-height: 1.45;
}

footer {
  min-height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 14px 42px;
  color: var(--muted);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.74rem;
}

button:focus-visible,
a:focus-visible,
input:focus-visible {
  outline: 3px solid var(--violet);
  outline-offset: 3px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

@media (max-width: 1120px) {
  .metrics {
    grid-template-columns: repeat(2, 1fr);
  }

  .metric:nth-child(2) {
    border-right: 0;
  }

  .metric:nth-child(-n + 2) {
    border-bottom: 1px solid var(--border);
  }

  .workflow-layout,
  .skills-grid {
    grid-template-columns: 1fr;
  }

  .department-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .route-inspector {
    position: static;
  }

  .system-flow {
    grid-template-columns: repeat(3, 1fr);
  }

  .system-flow li {
    border-bottom: 1px solid var(--border);
  }

  .system-flow li:nth-child(3) {
    border-right: 0;
  }

  .system-flow li::after {
    display: none !important;
  }

  .journey-stage-card {
    width: min(480px, calc(100% - 140px));
  }
}

@media (min-width: 900px) {
  .journey-tagline-line {
    white-space: nowrap;
  }
}

@media (max-width: 820px) {
  .site-shell {
    width: min(100% - 24px, 1544px);
    margin: 12px auto;
    box-shadow: 7px 7px 0 #d9e7fb;
  }

  .topbar {
    min-height: 0;
    align-items: flex-start;
    padding: 26px 22px;
  }

  .topbar-actions {
    justify-items: start;
  }

  .section-nav {
    overflow-x: auto;
    padding-inline: 10px;
  }

  .section-nav a {
    flex: 0 0 auto;
  }

  .company-section,
  .dashboard-links-section,
  .workflow-section,
  .skills-section,
  .system-section {
    padding: 30px 22px;
  }

  .dashboard-links-intro,
  .section-heading {
    grid-template-columns: 1fr;
    gap: 12px;
  }

  .workflow-tools {
    align-items: stretch;
    flex-direction: column;
  }

  .department-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .department-all {
    grid-template-columns: 52px 1fr;
  }

  .department-all > small {
    grid-column: 2;
  }

  .search-field {
    width: 100%;
  }

  .workflow-row {
    grid-template-columns: 38px 1fr auto;
  }

  .workflow-chips {
    grid-column: 2 / -1;
  }

  .skill-cards {
    grid-template-columns: 1fr;
  }

  .skill-card,
  .skill-card:nth-child(even) {
    border-right: 0;
  }

  .system-flow {
    grid-template-columns: 1fr;
  }

  .system-flow li,
  .system-flow li:nth-child(3) {
    border-right: 0;
  }

  .journey-static {
    height: auto;
  }
}

@media (max-width: 580px) {
  .topbar {
    flex-direction: column;
  }

  h1 {
    font-size: 2.7rem;
  }

  .registry-state {
    min-width: 0;
    justify-items: start;
    text-align: left;
  }

  .metrics {
    grid-template-columns: 1fr;
  }

  .department-grid {
    grid-template-columns: 1fr;
  }

  .dashboard-link-grid {
    grid-template-columns: 1fr;
  }

  .dashboard-link-card {
    min-height: 190px;
  }

  .department-card {
    min-height: 0;
  }

  .department-all {
    grid-template-columns: 1fr;
    gap: 3px;
  }

  .department-all > small {
    grid-column: auto;
  }

  .metric,
  .metric:nth-child(2),
  .metric:last-child {
    min-height: 118px;
    border-right: 0;
    border-bottom: 1px solid var(--border);
  }

  .metric:last-child {
    border-bottom: 0;
  }

  .workflow-row {
    grid-template-columns: 32px 1fr;
    gap: 10px;
  }

  .workflow-row .status-badge,
  .workflow-chips {
    grid-column: 2;
    justify-self: start;
  }

  footer {
    align-items: flex-start;
    flex-direction: column;
    padding-inline: 22px;
  }
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }

  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }

  .journey-static {
    height: auto;
  }
}
